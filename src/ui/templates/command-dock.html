  <!-- Unified bottom command dock: locations and voice (injected at runtime) -->
  <div id="command-dock" aria-label="Navigation and voice controls" data-i18n-aria-label>
  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed gev-location gev-surface">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Expand LOCATION" title="Expand LOCATION" data-i18n-aria-label data-i18n-title>
          <span class="location-toolbar-label" data-i18n-runtime><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>LOCATION</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="Collapse panel" data-i18n-title>+</button>
      </div>
      <template data-location-view="status"></template>
      <div id="location-bar-popover" class="dock-popover-content">
        <template data-location-view="pin"></template>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <template data-location-view="search"></template>
        </div>
        <template data-location-view="results"></template>
      </div>
    </div>
  </div>
  </div>
