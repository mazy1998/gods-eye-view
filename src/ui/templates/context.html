  <!-- Global Context is deliberately independent from the left layer accordion. -->
  <aside id="right-context-rail">
    <div id="weather-panel" class="panel-collapsible" data-panel-id="weather-panel" hidden>
      <div class="panel-glow"></div>
      <div class="weather-panel-inner" data-rail-scroller>
        <div class="panel-header">
          <span class="panel-title" data-i18n>WEATHER</span>
          <span id="weather-panel-count" aria-label="Active weather products" data-i18n-aria-label>0</span>
          <span class="panel-divider"></span>
          <button class="panel-collapse-btn" data-collapse-target="weather-panel" type="button" title="Collapse panel" data-i18n-title>▼</button>
        </div>
        <div id="weather-panel-body" data-rail-scroller></div>
      </div>
    </div>
    <div id="recent-imagery-panel" class="panel-collapsible" data-panel-id="recent-imagery-panel" hidden>
      <div class="panel-glow"></div>
      <div class="recent-imagery-panel-inner gev-surface" data-rail-scroller>
        <div class="panel-header">
          <span class="panel-title" data-i18n>RECENT IMAGERY</span>
          <span id="recent-imagery-panel-count" aria-label="Imagery days in the box" data-i18n-aria-label></span>
          <span class="panel-divider"></span>
          <button class="panel-collapse-btn" data-collapse-target="recent-imagery-panel" type="button" title="Collapse panel" data-i18n-title>▼</button>
        </div>
        <div id="recent-imagery-panel-body" data-rail-scroller></div>
      </div>
    </div>
    <div id="global-context-panel" class="panel-collapsible collapsed" data-panel-id="global-context-panel">
      <div class="panel-glow"></div>
      <div class="global-context-panel-inner" data-rail-scroller>
        <div class="panel-header">
          <span class="panel-title" data-i18n>CONTEXT</span>
          <span class="panel-divider"></span>
          <button class="panel-collapse-btn" data-collapse-target="global-context-panel" title="Expand panel" data-i18n-title>▶</button>
        </div>
        <div class="cyber-panel-body" data-rail-scroller>
        <div class="global-context-modes" role="tablist" aria-label="Inspect" data-i18n-aria-label>
          <button id="global-context-flights-btn" class="context-mode-button" type="button" role="tab" tabindex="0" aria-selected="false" aria-controls="context-flights-view" aria-label="Contacts" title="Cycles the nearest contacts of whatever type you select — planes, vessels, installations. Satellites track independently." data-i18n-aria-label data-i18n-title>
            <span class="material-symbols-outlined" aria-hidden="true">radar</span>
            <span data-i18n>Contacts</span>
          </button>
          <button id="global-context-missions-btn" class="context-mode-button" type="button" role="tab" tabindex="0" aria-selected="false" aria-controls="context-missions-view">
            <span class="material-symbols-outlined" aria-hidden="true">rocket_launch</span>
            <span data-i18n>Missions</span>
          </button>
          <button id="global-context-cameras-btn" class="context-mode-button" type="button" role="tab" tabindex="0" aria-selected="false" aria-controls="context-cameras-view">
            <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
            <span data-i18n>Cameras</span>
          </button>
        </div>
        <div id="context-mode-standby" class="context-mode-standby">
          <strong data-i18n>Choose what to inspect</strong>
          <span data-i18n-runtime>Contacts — nearest planes, vessels and sites<br>Missions — launches and orbital assets</span>
        </div>
        <section id="context-flights-view" class="context-mode-view" role="tabpanel" aria-labelledby="global-context-flights-btn" hidden>
          <aside id="military-awareness-panel"></aside>
          <div class="global-context-actions" aria-label="Contact Context actions" data-i18n-aria-label>
            <button id="cockpit-entry" type="button" hidden>
              <span class="material-symbols-outlined" aria-hidden="true">flight</span>
              <span data-i18n>Enter cockpit</span>
            </button>
            <button id="installations-search-btn" class="panel-layer-toggle" type="button"><span class="material-symbols-outlined" aria-hidden="true">account_balance</span><span data-i18n>Search nearby sites</span></button>
            <button id="tr3b-toggle" class="tr3b-toggle" type="button" aria-pressed="false" hidden aria-label="Reclassify tracked contact as TR-3B" title="Reclassify as TR-3B" data-i18n-aria-label data-i18n-title><span class="tr3b-toggle-glyph" aria-hidden="true">🛸</span><span class="tr3b-toggle-label" aria-hidden="true" data-i18n>Reclassify as TR-3B</span></button>
          </div>
        </section>
        <section id="context-missions-view" class="context-mode-view" role="tabpanel" aria-labelledby="global-context-missions-btn" hidden>
          <div id="space-mission-panel-host">
            <div id="space-mission-roster" class="space-mission-roster" aria-label="Available Space Missions" data-i18n-aria-label></div>
          </div>
        </section>
        <section id="context-cameras-view" class="context-mode-view" role="tabpanel" aria-labelledby="global-context-cameras-btn" hidden>
          <!-- CCTV Coverage Panel -->
          <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
            <div class="panel-glow"></div>
            <div class="cctv-panel-inner" data-rail-scroller>
              <div class="panel-header">
                <span class="material-symbols-outlined inspect-camera-icon" aria-hidden="true">camera_alt</span>
                <span class="panel-title" data-i18n>CCTV</span>
                <span class="panel-divider"></span>
                <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="Collapse panel" data-i18n-title>+</button>
              </div>
              <div id="cctv-controls-body" class="cyber-panel-body" data-rail-scroller></div>
            </div>
          </div>

          <!-- Street Level Panel -->
          <div id="street-level-panel" class="panel-collapsible collapsed" data-panel-id="street-level-panel">
            <div class="panel-glow"></div>
            <div class="street-level-panel-inner" data-rail-scroller>
              <div class="panel-header">
                <span class="material-symbols-outlined inspect-camera-icon" aria-hidden="true">streetview</span>
                <span class="panel-title" data-i18n>STREET LEVEL</span>
                <span class="panel-divider"></span>
                <button id="sl-status" class="sl-status" type="button" aria-pressed="false" title="Turn Street Level on or off" data-i18n-title data-i18n>OFF</button>
                <button class="panel-collapse-btn" data-collapse-target="street-level-panel" title="Expand panel" data-i18n-title>◀</button>
              </div>
              <div id="sl-body" class="sl-body"></div>
            </div>
          </div>

        </section>
        <section id="radio-panel" class="panel-collapsible collapsed" data-panel-id="radio-panel" aria-label="Internet radio and local SDR" data-i18n-aria-label>
          <div class="radio-panel-inner gev-surface">
            <div class="panel-header">
              <span class="panel-title" data-i18n>Radio</span>
              <span id="radio-layer-state" class="radio-layer-state" data-i18n>OFF</span>
              <span class="panel-divider"></span>
              <button class="panel-collapse-btn" data-collapse-target="radio-panel" title="Expand Radio" aria-label="Expand Radio section" data-i18n-title data-i18n-aria-label>+</button>
            </div>
            <template data-radio-view="internet"></template>
            <div id="sdr-radio-card" class="sdr-radio-card" role="group" aria-label="Local receiver (RTL-SDR)" data-i18n-aria-label>
            </div>
          </div>
        </section>
        </div>
      </div>
    </div>
  </aside>

  <div id="scene-runtime"></div>
